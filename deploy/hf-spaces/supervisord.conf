[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:mcp-server]
directory=/app/services/omnibeat-mcp-server
command=python3 src/server.py --host 127.0.0.1 --port 8080
autostart=true
autorestart=true
stdout_logfile=/tmp/omnibeat-8080.log
stderr_logfile=/tmp/omnibeat-8080.log
startsecs=5

[program:chaos-mock]
directory=/app/services/chaos-and-provider-mock
command=python3 src/app.py --host 127.0.0.1 --port 9000
autostart=true
autorestart=true
stdout_logfile=/tmp/omnibeat-9000.log
stderr_logfile=/tmp/omnibeat-9000.log
startsecs=5

[program:orchestrator]
directory=/app/services/alexa-agent-orchestrator
environment=MCP_SERVER_URL="http://localhost:8080/mcp"
command=node dist/server.js
autostart=true
autorestart=true
stdout_logfile=/tmp/omnibeat-4000.log
stderr_logfile=/tmp/omnibeat-4000.log
startsecs=5

[program:simulator]
directory=/app/apps/alexa-plus-simulator
; PORT comes from the platform (Render sets it; default 7860 for HF Spaces)
command=npx next start -p %(ENV_PORT)s -H 0.0.0.0
environment=PORT="7860"
autostart=true
autorestart=true
stdout_logfile=/tmp/omnibeat-7860.log
stderr_logfile=/tmp/omnibeat-7860.log
startsecs=10
