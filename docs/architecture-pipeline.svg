<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="ap-title ap-desc" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
  <title id="ap-title">Inside the Intent Lock kernel — five stages, named kill channels, the pin gate</title>
  <desc id="ap-desc">The intent_lock pipeline from Operator Compiler to the MRTR Pin Gate: stages A to E, the six named kill channels, the three verdicts, and the tie-to-pin re-verification loop.</desc>
  <defs>
    <marker id="ap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3EC6F3"/>
    </marker>
    <marker id="ap-arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6E87A0"/>
    </marker>
    <marker id="ap-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F2A93B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="#0B141F"/>

  <!-- ===== Header ===== -->
  <text x="40" y="50" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="2.5" fill="#3EC6F3">INSIDE THE KERNEL · ONE CALL: intent_lock</text>
  <text x="40" y="88" font-size="30" font-weight="600" fill="#EAF3FA">Five stages. Every trap dies named.</text>
  <text x="40" y="116" font-size="14.5" fill="#9DB2C6">The same pipeline guards music, commerce and grocery — only the catalog pack changes.</text>

  <!-- ===== Connectors ===== -->
  <!-- inter-stage arrows -->
  <line x1="258" y1="245" x2="270" y2="245" stroke="#3EC6F3" stroke-width="2" marker-end="url(#ap-arrow)"/>
  <line x1="494" y1="245" x2="506" y2="245" stroke="#3EC6F3" stroke-width="2" marker-end="url(#ap-arrow)"/>
  <line x1="730" y1="245" x2="742" y2="245" stroke="#3EC6F3" stroke-width="2" marker-end="url(#ap-arrow)"/>
  <line x1="966" y1="245" x2="978" y2="245" stroke="#3EC6F3" stroke-width="2" marker-end="url(#ap-arrow)"/>
  <!-- decide fan: E down to the bus, bus across, ticks down -->
  <path d="M1092,320 L1092,352 L216,352" fill="none" stroke="#3EC6F3" stroke-width="1.5"/>
  <line x1="216" y1="352" x2="216" y2="378" stroke="#3EC6F3" stroke-width="1.5" marker-end="url(#ap-arrow)"/>
  <line x1="600" y1="352" x2="600" y2="378" stroke="#3EC6F3" stroke-width="1.5" marker-end="url(#ap-arrow)"/>
  <line x1="984" y1="352" x2="984" y2="378" stroke="#3EC6F3" stroke-width="1.5" marker-end="url(#ap-arrow)"/>
  <rect x="1010" y="330" width="66" height="18" fill="#0B141F"/>
  <text x="1076" y="344" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#3EC6F3">DECIDE</text>
  <text x="40" y="340" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.5" fill="#6E87A0">THE GATE DECIDES — EXACTLY THREE OUTCOMES</text>
  <text x="1180" y="374" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#6E87A0">TIE MARGIN 0.04</text>
  <!-- eliminations down -->
  <line x1="216" y1="468" x2="216" y2="538" stroke="#6E87A0" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ap-arrow-soft)"/>
  <rect x="226" y="494" width="176" height="18" fill="#0B141F"/>
  <text x="228" y="508" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#6E87A0">EVERY ELIMINATION, NAMED</text>
  <!-- pin loop: tie bottom -> right -> up into E -->
  <path d="M600,468 L600,508 L1192,508 L1192,326" fill="none" stroke="#F2A93B" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ap-arrow-amber)"/>
  <rect x="700" y="498" width="392" height="18" fill="#0B141F"/>
  <text x="896" y="512" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#F2A93B">pin {source, track_id} → re-verified · banned pin refused</text>

  <!-- ===== Stage cards ===== -->
  <!-- A -->
  <rect x="40" y="170" width="216" height="150" rx="8" fill="#111E2C" stroke="#2A4258" stroke-width="1"/>
  <rect x="54" y="184" width="26" height="26" rx="4" fill="#17384C"/>
  <text x="67" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#3EC6F3">A</text>
  <text x="54" y="238" font-size="16" font-weight="600" fill="#EAF3FA">Operator Compiler</text>
  <text x="54" y="264" font-size="12" fill="#9DB2C6">raw words compile to operators</text>
  <text x="54" y="282" font-size="12" fill="#9DB2C6">veto binds in its clause</text>
  <text x="54" y="306" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6E87A0">≠ VETO · t₀ · ≡ EXACT · @</text>
  <!-- B -->
  <rect x="276" y="170" width="216" height="150" rx="8" fill="#111E2C" stroke="#2A4258" stroke-width="1"/>
  <rect x="290" y="184" width="26" height="26" rx="4" fill="#17384C"/>
  <text x="303" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#3EC6F3">B</text>
  <text x="290" y="238" font-size="16" font-weight="600" fill="#EAF3FA">Temporal Entity Memory</text>
  <text x="290" y="264" font-size="12" fill="#9DB2C6">Taste Lock rules fire on the</text>
  <text x="290" y="282" font-size="12" fill="#9DB2C6">host clock — before any fetch</text>
  <text x="290" y="306" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6E87A0">AFTER 22:00 → LOFI VERSION</text>
  <!-- C -->
  <rect x="512" y="170" width="216" height="150" rx="8" fill="#111E2C" stroke="#2A4258" stroke-width="1"/>
  <rect x="526" y="184" width="26" height="26" rx="4" fill="#17384C"/>
  <text x="539" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#3EC6F3">C</text>
  <text x="526" y="230" font-size="15.5" font-weight="600" fill="#EAF3FA">Supply Harvester</text>
  <text x="526" y="250" font-size="15.5" font-weight="600" fill="#EAF3FA">+ Variant Expander</text>
  <text x="526" y="274" font-size="12" fill="#9DB2C6">spelling variants race the catalogs</text>
  <text x="526" y="292" font-size="12" fill="#9DB2C6">one tensor · ISRC-keyed merge</text>
  <text x="526" y="312" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6E87A0">POOL &lt; 8 NON-VAULT → REFUSE</text>
  <!-- D -->
  <rect x="748" y="170" width="216" height="150" rx="8" fill="#111E2C" stroke="#2A4258" stroke-width="1"/>
  <rect x="762" y="184" width="26" height="26" rx="4" fill="#17384C"/>
  <text x="775" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#3EC6F3">D</text>
  <text x="762" y="238" font-size="16" font-weight="600" fill="#EAF3FA">Articulatory Grounding</text>
  <text x="762" y="264" font-size="12" fill="#9DB2C6">context anchor arbitrates first</text>
  <text x="762" y="282" font-size="12" fill="#9DB2C6">sound, not spelling</text>
  <text x="762" y="306" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6E87A0">PANPHON 70 · SKELETON 30</text>
  <!-- E -->
  <rect x="984" y="170" width="216" height="150" rx="8" fill="#111E2C" stroke="#3EC6F3" stroke-width="1.5"/>
  <rect x="998" y="184" width="26" height="26" rx="4" fill="#17384C"/>
  <text x="1011" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#3EC6F3">E</text>
  <text x="998" y="238" font-size="16" font-weight="600" fill="#EAF3FA">Elimination + Pin Gate</text>
  <text x="998" y="264" font-size="12" fill="#9DB2C6">traps die named, in the open</text>
  <text x="998" y="282" font-size="12" fill="#9DB2C6">top survivor must clear the floor</text>
  <text x="998" y="306" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6E87A0">FLOOR 0.60 · 0.70 UNDER ≡</text>

  <!-- ===== Verdicts ===== -->
  <rect x="40" y="384" width="352" height="84" rx="8" fill="#2A2113" stroke="#F2A93B" stroke-width="1.5"/>
  <text x="64" y="420" font-size="18" font-weight="600" fill="#FFD9A0">locked</text>
  <text x="64" y="444" font-size="12" fill="#9DB2C6">top survivor clears the floor — one recording,</text>
  <text x="64" y="460" font-size="12" fill="#9DB2C6">with its proof on the card</text>
  <rect x="424" y="384" width="352" height="84" rx="8" fill="#111E2C" stroke="#2A4258" stroke-width="1"/>
  <text x="448" y="420" font-size="18" font-weight="600" fill="#EAF3FA">tie_choice</text>
  <text x="448" y="444" font-size="12" fill="#9DB2C6">a true tie is never guessed — both survivors</text>
  <text x="448" y="460" font-size="12" fill="#9DB2C6">are named; the user pins one</text>
  <rect x="808" y="384" width="352" height="84" rx="8" fill="#111E2C" stroke="#2A4258" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="832" y="420" font-size="18" font-weight="600" fill="#9DB2C6">no_lock</text>
  <text x="832" y="444" font-size="12" fill="#9DB2C6">nothing clears the floor, or the pool is too</text>
  <text x="832" y="460" font-size="12" fill="#9DB2C6">thin — an honest refusal</text>

  <!-- ===== Kill channels ===== -->
  <rect x="40" y="544" width="1160" height="118" rx="8" fill="#111E2C" stroke="#2A4258" stroke-width="1"/>
  <text x="64" y="574" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#3EC6F3">KILL CHANNELS — A PLAIN REASON AND ITS SOURCE, PRINTED ON THE CARD</text>
  <text x="64" y="606" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#EAF3FA">veto</text>
  <text x="112" y="606" font-size="12" fill="#9DB2C6">— spoken ban: nahi · sin · vendam · not</text>
  <text x="470" y="606" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#EAF3FA">trap</text>
  <text x="518" y="606" font-size="12" fill="#9DB2C6">— karaoke · compilation swap · wrong film</text>
  <text x="880" y="606" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#EAF3FA">rule_override</text>
  <text x="986" y="606" font-size="12" fill="#9DB2C6">— fired Taste Lock wins</text>
  <text x="64" y="640" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#EAF3FA">spec_contradiction</text>
  <text x="207" y="640" font-size="12" fill="#9DB2C6">— title claim vs its own spec table</text>
  <text x="470" y="640" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#EAF3FA">swap</text>
  <text x="518" y="640" font-size="12" fill="#9DB2C6">— sponsored / substitute row</text>
  <text x="880" y="640" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#EAF3FA">requirement</text>
  <text x="971" y="640" font-size="12" fill="#9DB2C6">— allergy · sugar-0 · spec unmet</text>

  <!-- ===== Footer ===== -->
  <text x="40" y="706" font-size="13" fill="#9DB2C6">The pin is the MRTR discipline (SEP-2322) as two ordinary tool calls on MCP 2025-11-25 — the server re-verifies; it never samples, never guesses.</text>
  <text x="1200" y="732" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.5" fill="#6E87A0">0 LLMs IN THE VERIFIER · ZERO SETTINGS · ₹0 PER CALL</text>
</svg>
