name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: MCP server — compile + data integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all server sources
        run: python -m compileall -q services/omnibeat-mcp-server/src
      - name: Grammar + catalog packs parse as JSON
        run: |
          python - <<'EOF'
          import json, glob
          for f in glob.glob("services/omnibeat-mcp-server/src/**/*.json", recursive=True):
              json.load(open(f))
              print("OK", f)
          EOF

  simulator:
    name: Simulator — install + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: apps/alexa-plus-simulator
        run: npm ci
      - name: Typecheck
        working-directory: apps/alexa-plus-simulator
        run: npx tsc --noEmit
